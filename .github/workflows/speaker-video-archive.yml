name: Cheyenne Speaker Video Splitter (2022-2022)

on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Meetings to split & publish in this run (newest -> oldest)"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: speaker-video-archive-cheyenne-archives-2022
  cancel-in-progress: false

jobs:
  archive-speaker-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Sparse checkout scripts & speaker-videos state
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            speaker-videos
          sparse-checkout-cone-mode: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg & diarization libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet librosa soundfile scikit-learn numpy

      - name: Split speaker video clips & publish Releases + Episode JSON (2022-2022)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish_to_github.py \
            --owner "${{ github.repository_owner }}" \
            --routing single-repo \
            --repo "${{ github.repository }}" \
            --min-year 2022 \
            --max-year 2022 \
            --batch-size "${{ inputs.batch_size || '3' }}" \
            --work-dir "/tmp/cheyenne_work"
